  const Outbox = {
    busy: false, st: {}, // id → { state: 'wait' | 'send' | 'err', done, total, msg, fails }
    init() {
      window.addEventListener('online', () => { this.kick(); if (screen === 'req' && Req.st.err) Req.load(false); }); // связь вернулась — подтягиваем и список
      window.addEventListener('offline', () => this.paint());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.kick(); });
      setInterval(() => this.kick(), 60000);
    },
    soon() { setTimeout(() => this.kick(), 1500); },
    paint() { if (screen === 'req' && Req.st.view === 'list') Req.render(); },
    /** Отчёт ушёл с экрана — отметить в списке заявок. */
    sent(key, status) { const li = Req.st.data && Req.st.data.items.find(x => x.key === key); if (li) li.photo = status; },
    async kick(force) {
      if (this.busy || demo || !state.me || state.me.status !== 'active') return;
      this.busy = true;
      try {
        const list = await Pending.list();
        Req.st.pending = list;
        for (const p of list) {
          const cur = this.st[p.id] || (this.st[p.id] = { state: 'wait', done: 0, total: 0, fails: 0 });
          if (Report.st && Report.st.reportId === p.id && (Report.st.sending || !Report.st.result)) continue; // открыт на экране отчёта
          if (cur.state === 'err' && cur.fails >= 3 && !force) continue; // постоянная ошибка — ждём решения человека
          if (navigator.onLine === false) { cur.state = 'wait'; continue; }
          const s = this.fromPending(p);
          cur.state = 'send'; cur.done = s.shots.arrival.filter(x => x.fileId).length + s.shots.departure.filter(x => x.fileId).length;
          cur.total = s.shots.arrival.length + s.shots.departure.length; this.paint();
          try {
            const r = await runSend(s, { queued: true, tick: () => { if (cur.done !== s.done) { cur.done = s.done; cur.total = s.total; this.paint(); } }, saved: () => Pending.saveRaw(p, s) });
            Pending.del(p.id); delete this.st[p.id];
            this.sent(p.item.key, r.status);
            Req.st.pending = (Req.st.pending || []).filter(x => x.id !== p.id);
            toast('Фотоотчёт по заявке ' + (p.item.no || '') + ' отправлен');
            haptic('success');
          } catch (e) {
            if (e.code === 'BUSY') { cur.state = 'send'; continue; }
            cur.msg = e.message;
            if (transientErr(e)) { cur.state = 'wait'; break; } // нет связи — остальные тоже не уйдут, ждём
            cur.state = 'err'; cur.fails++;
          }
          this.paint();
        }
      } finally { this.busy = false; this.paint(); }
    },
    /** Запись очереди → состояние для движка (фото уже сжаты, загруженные помнят свой ID). */
    fromPending(p) {
      const wrap = x => ({ blob: x.blob, meta: x.meta, fileId: x.fileId || '' });
      return { item: p.item, type: p.type, times: p.times || {}, noPhoto: !!p.noPhoto, comment: p.comment || '', reportId: p.id, resumed: true,
        location: p.location || null, skipLocation: true, pressedAt: p.pressedAt || p.at,
        shots: { arrival: p.shots.arrival.map(wrap), departure: p.shots.departure.map(wrap) } };
    },
    label(p) {
      const c = this.st[p.id] || { state: 'wait' };
      const n = p.shots.arrival.length + p.shots.departure.length;
      if (c.state === 'send') return { t: 'Отправляем фотоотчёт…', sub: c.total ? 'фото ' + c.done + ' из ' + c.total : 'сохраняем', busy: true };
      if (c.state === 'err' && c.fails >= 3) return { t: 'Фотоотчёт не отправился', sub: c.msg || 'Ошибка', err: true };
      if (navigator.onLine === false) return { t: 'Ждёт связи', sub: n + ' фото · отправится сам, когда появится интернет' };
      return { t: 'В очереди на отправку', sub: n + ' фото · ' + (c.msg ? 'повторим через минуту: ' + c.msg : 'отправится сам через несколько секунд') };
    },
  };

  const Report = {
    st: null,
    picker: null,

    open(item) {
      const has = item.photo || 'none';
      this.st = { item, type: has === 'arrival' ? 'departure' : has === 'departure' ? 'arrival' : 'full',
        shots: { arrival: [], departure: [] }, times: { arrival: '', departure: '' }, noPhoto: false,
        comment: '', sending: false, done: 0, total: 0, error: '', result: null };
      screen = 'report';
      window.scrollTo(0, 0);
      setBack(() => this.close());
      this.render();
    },
    /**
     * Плавная полоска: готовые фото + «идущие» фото по времени (сервер не сообщает проценты — оцениваем
     * по типичным ~4 с на фото) + последний шаг «сохраняем отчёт». Обновляется только полоска, без перерисовки экрана.
     */
    progress() {
      const s = this.st;
      if (!s || !s.total && !s.committing) return s && s.committing === -1 ? 1 : 0;
      if (s.committing === -1) return 1;
      const ease = (t, tau) => 1 - Math.exp(-t / tau);
      const now = Date.now();
      let running = 0;
      (s.inflight || new Map()).forEach((t0, q) => { running += q.frac != null ? 0.96 * q.frac : 0.92 * ease(now - t0, 2000); }); // прямая загрузка — настоящий процент
      const commit = s.committing > 0 ? 0.9 * ease(now - s.committing, 1500) : 0;
      return Math.min(0.99, (s.done + running + commit) / (s.total + 1));
    },
    paintProgress() {
      const s = this.st; if (!s) return;
      const pct = document.querySelector('.send-box .send-pct'), cnt = document.querySelector('.send-box .big-status span'), ttl = document.querySelector('.send-box .big-status b');
      if (!pct) return;
      pct.textContent = Math.round(this.progress() * 100) + '%';
      if (cnt) cnt.textContent = s.done + '/' + s.total;
      if (ttl) ttl.textContent = s.done < s.total ? 'Отправляем фото' : 'Сохраняем отчёт…';
    },

    close() {
      const s = this.st;
      if (s && s.sending) return toast('Дождитесь окончания отправки');
      if (s && !s.result && (s.shots.arrival.length || s.shots.departure.length) && !window.confirm('Выйти без отправки? Выбранные фото не сохранятся.')) return;
      if (s && s.reportId && !s.result) Pending.del(s.reportId); // человек сам отказался от отчёта
      this.st = null;
      Req.openDetail(Req.st.detailKey, true);
    },
    stages() { return this.st.type === 'full' ? ['arrival', 'departure'] : [this.st.type]; },
    /** «Нет фото» бывает только у убытия в полном отчёте: машина уехала раньше, чем успели снять */
    noPhoto(k) { return k === 'departure' && this.st.type === 'full' && this.st.noPhoto; },
    count() { return this.stages().reduce((n, k) => n + (this.noPhoto(k) ? 0 : this.st.shots[k].filter(x => x.blob).length), 0); },
    /** чего не хватает для отправки (пусто — можно отправлять) */
    missing() {
      const s = this.st, ks = this.stages();
      if (ks.some(k => !this.noPhoto(k) && s.shots[k].some(x => x.busy))) return 'Обрабатываем фото…';
      if (ks.some(k => !this.noPhoto(k) && !s.shots[k].some(x => x.blob))) return 'Добавьте фото';
      const t = ks.filter(k => !/^\d{2}:\d{2}$/.test(s.times[k] || ''));
      if (t.length) return 'Укажите время ' + t.map(k => (k === 'arrival' ? 'прибытия' : 'убытия')).join(' и ');
      return '';
    },
    ready() { return !this.missing(); },

    render() {
      if (screen !== 'report' || !this.st) return;
      const s = this.st, it = s.item;
      if (s.result) return this.renderDone();
      const has = it.photo || 'none';
      const type = (id, title, sub, doneTag) => `<button class="type ${s.type === id ? 'on' : ''}" data-p="type" data-v="${id}" ${s.sending ? 'disabled' : ''}><i></i><span><b>${title}</b><small>${sub}</small></span>${doneTag ? '<em>уже есть</em>' : ''}</button>`;
      const shotsHtml = st => {
        const list = s.shots[st];
        return `<div class="shots">${list.map((x, i) => `<div class="shot">${x.url ? `<img src="${x.url}" alt="">` : ''}
            ${x.busy ? '<div class="busy">' + loader(28) + '</div>' : ''}
            ${x.meta && x.meta.lat != null ? '<span class="geo">GPS</span>' : ''}
            ${s.sending ? '' : `<button class="x" data-p="rm" data-v="${st}:${i}" aria-label="Удалить фото">×</button>`}</div>`).join('')}
          ${list.length < 10 && !s.sending ? `<button class="add" data-p="add" data-v="${st}"><span class="add-in">${ICON.plus}<b>${list.length ? 'Ещё фото' : 'Добавить фото'}</b></span></button>` : ''}</div>`;
      };
      // время по факту: поле на две колонки сетки фото + «Сейчас» в третьей — края совпадают с плитками
      const timeRow = st => `<div class="time-row"><span class="time-wrap ${s.times[st] ? '' : 't-empty'}">${ICON.clock}<input class="input time" type="time" id="t_${st}" data-t="${st}" value="${esc(s.times[st] || '')}" ${s.sending ? 'disabled' : ''} aria-label="${st === 'arrival' ? 'Время прибытия' : 'Время убытия'}"><span class="time-hint" aria-hidden="true">${st === 'arrival' ? 'Время прибытия' : 'Время убытия'}</span></span>
          <button class="chip now-btn" data-p="now" data-v="${st}" ${s.sending ? 'disabled' : ''}>Сейчас</button></div>`;
      const section = st => {
        const canNo = st === 'departure' && s.type === 'full';
        const off = this.noPhoto(st);
        return `<p class="sect">${s.type === 'full' ? (st === 'arrival' ? 'Прибытие' : 'Убытие') : st === 'arrival' ? 'Прибытие' : 'Убытие'}${off ? '<small>без фото</small>' : ''}</p>
        <div class="card glass">${timeRow(st)}
          ${off ? `<div class="no-photo">Фото убытия нет — машина уехала раньше, чем удалось снять. Укажите время убытия; отчёт уйдёт на проверку.</div>` : shotsHtml(st)}
          ${canNo && !s.sending ? `<button class="chip no-photo-btn ${off ? 'on' : ''}" data-p="nophoto">${off ? '✓ Нет фото — вернуть фото' : 'Нет фото'}</button>` : ''}
        </div>`;
      };
      const n = this.count();
      setApp(`<div class="topbar"><button class="round" data-p="back" aria-label="Назад">${ICON.back}</button>
          <div class="grow"><h2>Фотоотчёт</h2><small>${it.no ? 'Заявка ' + esc(it.no) : 'Заявка'}${it.time ? ' · ' + esc(it.time) : ''} · ${esc(it.vehicle || '')}</small></div></div>
        <div class="card glass hint-card"><div class="ic">${ICON.camera}</div><div><h3>Что фиксируем?</h3>
          <p>Полный — прибытие и убытие. Этап — что-то одно, второе можно дослать позже.</p></div></div>
        <div class="types">
          ${type('full', 'Полный отчёт', 'Прибытие и убытие сразу', has === 'full')}
          ${type('arrival', 'Прибытие', 'Можно дополнить позже', has === 'arrival' || has === 'full')}
          ${type('departure', 'Убытие', 'Завершит отчёт после прибытия', has === 'departure' || has === 'full')}
        </div>
        ${this.stages().map(section).join('')}
        <p class="sect">Комментарий<small>необязательно</small></p>
        <div class="card glass"><textarea class="input area" id="pComment" maxlength="1000" placeholder="Например: разгрузка завершена" ${s.sending ? 'disabled' : ''}>${esc(s.comment)}</textarea></div>
        <p class="note">Фото сохранятся в папку заявки на Google Диске</p>
        <div class="send-space"></div>
        <div class="send-bar"><button class="primary" data-p="send" ${this.ready() && !s.sending ? '' : 'disabled'}>${this.missing() || 'Отправить' + (n ? ' · ' + n + ' фото' : '')}</button></div>
        ${s.sending || s.error ? `<div class="send-overlay"><div class="send-box glass" role="alertdialog" aria-live="polite">
            ${s.error ? '' : `<div class="send-loader">${loader(96)}</div>`}
            <div class="big-status ${s.error ? '' : 'center'}"><b>${s.error ? 'Отправка прервалась' : s.done < s.total ? 'Отправляем фото' : 'Сохраняем отчёт…'}</b><span>${s.done}/${s.total}</span></div>
            ${s.error ? '' : `<div class="send-pct">${Math.round(this.progress() * 100)}%</div>`}
            ${s.error ? `<div class="hint" style="margin:6px 2px 12px">${esc(s.error)}</div>
              <button class="primary small" data-p="send">Повторить — отправленные фото не потеряются</button>
              <button class="secondary small" data-p="hideErr" style="margin-top:10px">Вернуться к отчёту</button>`
            : '<p class="note" style="margin:12px 0 0;text-align:center">Не закрывайте приложение до конца отправки. Если всё же закроете — отчёт отправится сам при следующем открытии.</p>'}
          </div></div>` : ''}`);
      this.wire();
    },

    renderDone() {
      const s = this.st, r = s.result, it = s.item;
      if (r.queued) {
        app.innerHTML = `<div class="center" style="padding-top:4vh"><div class="badge glass" style="color:var(--primary)">${ICON.clock || ICON.check}</div>
            <p class="eyebrow">Нет связи</p><h1>Отчёт сохранён на телефоне</h1>
            <p class="lead">Он отправится сам, как только появится интернет. Можно продолжать работу: статус виден над списком заявок.
            Если закрыть приложение, отправка продолжится при следующем открытии.</p></div>
          <div class="card glass"><div class="big-status"><span>Заявка ${esc(it.no || '')}</span><span class="ph none">в очереди</span></div></div>
          <button class="primary" data-p="back">Вернуться к заявке</button>`;
        return this.wire();
      }
      app.innerHTML = `<div class="center" style="padding-top:4vh"><div class="badge ok glass">${ICON.check}</div>
          <p class="eyebrow">Готово</p><h1>Фотоотчёт отправлен</h1>
          <p class="lead">${r.photos ? r.photos + ' ' + plural(r.photos, 'фотография сохранена', 'фотографии сохранены', 'фотографий сохранено') + ' в папку заявки ' + esc(it.no || '') + '.' : 'Отчёт сохранён.'}</p></div>
        <div class="card glass"><div class="big-status"><span>Статус фотоотчёта</span><span class="ph ${r.status}">${PH_LABEL[r.status] || '—'}</span></div></div>
        <button class="primary" data-p="back">Вернуться к заявке</button>
        <button class="secondary" data-p="more">Добавить ещё фото</button>`;
      this.wire();
    },

    wire() {
      app.onclick = e => { const b = e.target.closest('[data-p]'); if (b && !b.disabled) this.act(b.dataset.p, b.dataset.v); };
      const c = document.getElementById('pComment'); if (c) { c.oninput = e => { this.st.comment = e.target.value; }; keyboardLift(c); }
      document.querySelectorAll('input[data-t]').forEach(t => { t.onchange = t.oninput = e => { this.st.times[e.target.dataset.t] = e.target.value; e.target.parentNode.classList.toggle('t-empty', !e.target.value); this.render(); }; });
    },

    pick(stage) {
      if (!this.picker) {
        this.picker = document.createElement('input');
        this.picker.type = 'file'; this.picker.accept = 'image/*'; this.picker.multiple = true; this.picker.style.display = 'none';
        document.body.appendChild(this.picker);
      }
      this.picker.value = '';
      this.picker.onchange = () => this.addFiles(stage, [...this.picker.files]);
      this.picker.click();
    },

    async addFiles(stage, files) {
      const s = this.st, list = s.shots[stage];
      files = files.slice(0, 10 - list.length);
      const slots = files.map(() => ({ busy: true }));
      list.push(...slots); this.render();
      for (let i = 0; i < files.length; i++) {
        try { Object.assign(slots[i], await processPhoto(files[i]), { busy: false }); }
        catch (e) { slots[i].failed = true; toast('Не удалось открыть фото — попробуйте другое'); }
        if (this.st !== s) return;
        this.render();
      }
      s.shots[stage] = list.filter(x => !x.failed);
      haptic('success'); this.render();
    },

    async send() {
      const s = this.st;
      if (!this.ready() || s.sending) return;
      s.sending = true; s.error = '';
      s.reportId = s.reportId || newReportId();
      s.pressedAt = s.pressedAt || Date.now();
      // Закрыть приложение во время отправки — Telegram переспросит. Отчёт сохраняется на телефоне:
      // если связь пропала или приложение закрыли, он отправится сам (очередь), сервер не создаст дублей.
      try { tg && tg.enableClosingConfirmation && tg.enableClosingConfirmation(); } catch (e) {}
      const closeOk = () => { try { tg && tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {} };
      s.total = 0; s.done = 0; s.committing = 0;
      this.render();
      if (navigator.onLine === false) { // связи нет совсем — сразу в очередь (место берём сейчас, пока человек на точке)
        s.location = s.location || await getLocation();
        await Pending.save(s); closeOk();
        s.sending = false; s.result = { queued: true }; haptic('warning'); this.render(); Outbox.soon();
        return;
      }
      await Pending.save(s);
      clearInterval(this.ticker); this.ticker = setInterval(() => this.paintProgress(), 150);
      try {
        const r = await runSend(s, { tick: () => this.paintProgress(), saved: () => Pending.save(s) });
        clearInterval(this.ticker); s.committing = -1; this.paintProgress(); await sleep(250); // полоска доходит до конца
        s.sending = false; s.result = { status: r.status, photos: r.photos || s.total };
        Pending.del(s.reportId); closeOk();
        Outbox.sent(s.item.key, r.status);
        haptic('success'); this.render();
      } catch (e) {
        clearInterval(this.ticker); closeOk();
        s.sending = false;
        if (transientErr(e)) { // связь пропала по дороге — отчёт (с уже загруженными фото) ждёт в очереди и уйдёт сам
          if (!s.location) s.location = await Promise.race([getLocation(), sleep(4000).then(() => null)]); // место — на точке, а не там, где появится связь
          await Pending.save(s);
          s.result = { queued: true, why: e.message }; haptic('warning'); this.render(); Outbox.soon();
        } else { s.error = e.message || 'Ошибка'; haptic('error'); this.render(); }
      }
    },

    act(a, v) {
      const s = this.st;
      switch (a) {
        case 'back': return s.result ? (this.st = null, Req.openDetail(Req.st.detailKey, true)) : this.close();
        case 'type': s.type = v; return this.render();
        case 'now': { const d = new Date(); s.times[v] = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); haptic('success'); return this.render(); }
        case 'nophoto': s.noPhoto = !s.noPhoto; haptic('success'); return this.render();
        case 'hideErr': s.error = ''; return this.render();
        case 'add': return this.pick(v);
        case 'rm': { const [st, i] = v.split(':'); const x = s.shots[st][+i]; if (x && x.url) URL.revokeObjectURL(x.url); s.shots[st].splice(+i, 1); return this.render(); }
        case 'send': return this.send();
        case 'more': { const item = { ...s.item, photo: s.result.status }; return this.open(item); }
      }
    },
  };

  /* =================== ЗАЯВКИ =================== */
  const WD = ['вс','пн','вт','ср','чт','пт','сб'];
  const WD_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const pad = n => String(n).padStart(2, '0');
  const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const dateOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  function shiftDay(iso, n) { const d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); }
  const todayIso = () => isoOf(new Date());
  const longDate = iso => { const d = dateOf(iso); return `${WD_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const shortDate = iso => { const d = dateOf(iso); return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  // Последние данные на телефоне: приложение открывается сразу с ними, а свежие подгружаются фоном.
  const myId = () => { try { return String(tg.initDataUnsafe.user.id || ''); } catch (e) { return ''; } };
  const local = {
    key: k => 't26c:' + myId() + ':' + k,
    get(k) { if (demo || !myId()) return null; try { return JSON.parse(localStorage.getItem(this.key(k)) || 'null'); } catch (e) { return null; } },
    set(k, v) {
      if (demo || !myId()) return;
      try { localStorage.setItem(this.key(k), JSON.stringify(v)); }
      catch (e) { this.prune(0); try { localStorage.setItem(this.key(k), JSON.stringify(v)); } catch (e2) {} }
    },
    /** храним списки только за последние ~2 недели */
    prune(keepDays = 14) {
      try {
        const pre = 't26c:' + myId() + ':', min = shiftDay(todayIso(), -keepDays);
        Object.keys(localStorage).forEach(k => {
          if (k.indexOf(pre) !== 0) return;
          const m = k.slice(pre.length).match(/^(day|item):(\d{4}-\d{2}-\d{2})/);
          if (m && (keepDays === 0 || m[2] < min)) localStorage.removeItem(k);
        });
      } catch (e) {}
    },
  };

  // Телефоны в свободном тексте — так же, как на сервере
  const PHONE_RE = () => /(?:\+\s?7|\b8|\b7)?[\s \-‐-―().]*(9\d{2})[\s \-‐-―().]*(\d{3})[\s \-‐-―().]*(\d{2})[\s \-‐-―().]*(\d{2})(?!\d)/g;
  const PLATE_RE = /[АВЕКМНОРСТУХABEKMHOPCTYX]\s?\d{3}\s?[АВЕКМНОРСТУХABEKMHOPCTYX]{2}\s?\d{2,3}(?!\d)/gi;
  const telHref = m => `tel:+7${m[1]}${m[2]}${m[3]}${m[4]}`;
  const telText = m => `+7 ${m[1]} ${m[2]}-${m[3]}-${m[4]}`;
  const cleanBits = t => String(t || '').replace(/^[\s,;:.\-–—/|()+]+|[\s,;:.\-–—/|(+]+$/g, '').replace(/\s{2,}/g, ' ').trim();

  /** «Лиана +7 (913) 716-49-39, Антон 8 966…» → [{ name, phone, href }] */
  function parseContacts(text) {
    text = String(text || '').trim();
    if (!text) return [];
    const re = PHONE_RE(), found = [];
    let m;
    while ((m = re.exec(text))) found.push({ m, start: m.index, end: re.lastIndex });
    if (!found.length) return [{ name: text }];
    // «+7… Татьяна +7… Александра» — имя после номера; «Лиана +7…» — перед номером
    const nameAfter = !cleanBits(text.slice(0, found[0].start));
    return found.map((f, i) => {
      const before = cleanBits(text.slice(i ? found[i-1].end : 0, f.start));
      const after = cleanBits(text.slice(f.end, found[i+1] ? found[i+1].start : text.length)).split(/\n/)[0];
      let name = nameAfter ? after : before;
      if (!name) name = nameAfter ? before : after;
      return { name: name.replace(/^(тел\.?|телефон:?)\s*/i, ''), phone: telText(f.m), href: telHref(f.m) };
    });
  }

  /** Свободный текст из колонки «транспорт» → номер машины, марка, водитель, телефон */
  function parseDriver(text) {
    text = String(text || '').trim();
    if (!text) return null;
    const plates = (text.match(PLATE_RE) || []).map(p => p.replace(/\s/g, '').toUpperCase());
    const phones = parseContacts(text).filter(c => c.phone);
    // подписи вида «Номер машины:», «Гос:», «Водитель:» — только целыми словами («длиномер» не трогаем)
    let rest = text.replace(PLATE_RE, ' ').replace(PHONE_RE(), ' ')
      .replace(/(^|[^а-яёa-z])(номер машины|марка машины|марка автомобиля|номер автомобиля|гос\.?\s*номер|гос|марка|номер|водитель|телефон|тел)(?![а-яёa-z])\s*[:.]?/gi, '$1 ')
      .replace(/^\s*\d+\.\s*/gm, '');
    const lines = rest.split(/\n|,(?![^(]*\))/).map(cleanBits).filter(Boolean);
    const title = l => l.toLowerCase().replace(/(^|[\s-])([а-яё])/g, (m, a, b) => a + b.toUpperCase());
    const isName = l => (/^[А-ЯЁ][а-яё]+(\s+[А-ЯЁ][а-яё]+){1,3}$/.test(l) || /^[А-ЯЁ]{2,}(\s+[А-ЯЁ]{2,}){1,3}$/.test(l)) && !/гражданин|паспорт|выдан/i.test(l);
    let name = lines.filter(isName).pop() || '';
    // одно имя рядом с телефоном: «Зафар 8977…», «Ислам ↵ +7…»
    if (!name && phones[0] && phones[0].name && /^[А-ЯЁ][а-яё]+$/.test(phones[0].name)) name = phones[0].name;
    if (/^[А-ЯЁ\s]+$/.test(name)) name = title(name);
    const nameKey = name.toLowerCase();
    const model = lines.find(l => l.toLowerCase() !== nameKey && !/гражданин|паспорт|выдан|г\.р\.|код подразделения/i.test(l) && l.length < 40) || '';
    return { plates, phones, name, model, raw: text };
  }

  /**
   * Маршрут в Яндекс Картах: от текущего места через все адреса заявки. Яндекс строит маршрут по координатам
   * (их присылает сервер); если координат нет — открываем поиск по адресу, чтобы точка хотя бы была на карте.
   */
  function yandexRoute(d) {
    const g = d.geo || {};
    const pts = ['from', 'mid', 'to'].filter(k => d[k] && g[k]).map(k => g[k].lat.toFixed(6) + ',' + g[k].lon.toFixed(6));
    if (pts.length) return 'https://yandex.ru/maps/?rtext=~' + pts.join('~') + '&rtt=auto';
    const addr = String(d.from || d.to || '').split('\n')[0].replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    return 'https://yandex.ru/maps/?mode=search&text=' + encodeURIComponent(/москв|област|обл\./i.test(addr) ? addr : 'Москва, ' + addr);
  }
  function openExternal(url) {
    try { if (tg && tg.openLink && !demo) return tg.openLink(url); } catch (e) {}
    window.open(url, '_blank');
  }

  const Req = {
    st: { day: todayIso(), scope: store.get('t26-scope') || 'mine', q: '', fp: new Set(), fu: new Set(), fph: new Set(), data: null, loading: false,
          sheet: false, view: 'list', detail: null, detailKey: '', err: null },

    /** opts.wait — список уже грузится стартовым запросом (boot), отдельный запрос не нужен */
    open(day, opts = {}) {
      app.onclick = null; screen = 'req';
      document.body.classList.remove('wide');
      this.st.view = 'list';
      if (day) this.st.day = day;
      setBack(null);
      if (opts.wait) { this.showSaved(this.st.day); this.st.loading = true; this.render(); return; }
      this.render();
      this.load(false);
    },

    /** Показать сохранённый на телефоне список дня (если есть), пока идёт загрузка свежего. */
    showSaved(day) {
      const s = this.st;
      if (s.data && s.data.day === day) return;
      const saved = local.get('day:' + day);
      s.data = saved && saved.day === day ? saved : null;
      s.stale = !!s.data;
    },

    /** Свежий список с сервера → на экран и в память телефона. */
    receive(r) {
      const s = this.st;
      if (!r || r.day !== s.day) return;
      s.data = r; s.stale = false; s.err = null; s.loading = false;
      local.set('day:' + r.day, r);
      if (!r.canSeeAll) s.scope = 'mine';
      // пока человек сам не выбрал вкладку: если «моих» на день нет, а заявки есть — сразу показываем «Все»
      else if (!store.get('t26-scope')) s.scope = r.items.some(i => i.mine) || !r.items.length ? 'mine' : 'all';
      if (s.view === 'list') this.render();
    },

    async load(refresh) {
      const s = this.st, day = s.day;
      s.loading = true; s.err = null; s.errShown = false;
      this.showSaved(day);
      this.render();
      try {
        const r = await api('requests.list', { date: day, refresh: !!refresh });
        if (s.day !== day) return; // пока грузили, выбрали другой день
        return this.receive(r);
      } catch (e) { s.err = e; if (e.code === 'NOT_ACTIVE') return start(); }
      s.loading = false;
      if (s.view === 'list') this.render();
    },

    setDay(day) {
      if (day === this.st.day) return;
      this.st.day = day; this.st.fp.clear(); this.st.fu.clear(); this.st.fph.clear();
      haptic('success'); this.load(false);
    },

    visible() {
      const s = this.st, items = (s.data && s.data.items) || [];
      const q = s.q.trim().toLowerCase();
      // сначала самые поздние по времени подачи, дальше по убыванию; заявки без времени — в конце
      return items.slice().sort((a, b) => (b.time || '').localeCompare(a.time || '')).filter(it => (s.scope === 'all' || it.mine)
        && (!s.fp.size || s.fp.has(it.project)) && (!s.fu.size || s.fu.has(it.purpose))
        && (!s.fph.size || s.fph.has(it.photo === 'arrival' || it.photo === 'departure' ? 'partial' : it.photo || 'none'))
        && (!q || [it.no, it.vehicle, it.from, it.to, it.project, it.purpose, it.cargo, it.transport].join(' ').toLowerCase().includes(q)));
    },

    head() {
      const me = state.me || {}, p = state.profile || {};
      const initials = ((p.lastName || '')[0] || '') + ((p.firstName || '')[0] || '');
      const off = this.st.err && this.st.err.code === 'OFFLINE';
      const sub = this.st.stale && this.st.loading ? ' · обновляем…' : this.st.stale && this.st.err ? (off ? ' · нет связи, сохранённые данные' : ' · сохранённые данные') : '';
      return `<div class="home-head"><div><h1>Заявки</h1><small>${longDate(this.st.day)}${sub}</small></div>
        <div class="head-btns">
          <button class="round ${this.st.refreshing ? 'spin' : ''}" data-r="refresh" aria-label="Обновить" ${this.st.refreshing ? 'disabled' : ''}>${ICON.refresh}</button>
          ${me.isAdmin ? `<button class="round" data-r="admin" aria-label="Админ-панель">${ICON.shield}${me.adminPending ? `<span class="dot">${me.adminPending}</span>` : ''}</button>` : ''}
          <button class="round avatar" data-r="profile" aria-label="Профиль">${esc(initials.toUpperCase() || '·')}</button>
        </div></div>`;
    },

    strip() {
      const s = this.st, counts = {};
      ((s.data && s.data.counts) || []).forEach(c => { counts[c.day] = c; });
      const today = todayIso();
      let html = '';
      for (let i = -3; i <= 3; i++) {
        const d = shiftDay(s.day, i), c = counts[d], dt = dateOf(d);
        const cls = ['day', d === s.day ? 'on' : '', d === today ? 'today' : '', c && c.mine ? 'mine' : '', c && (c.all || c.mine) ? 'has' : ''].join(' ');
        const label = c ? `${c.mine ? 'ваших ' + c.mine : ''}${c.all !== null && c.all !== undefined ? (c.mine ? ', ' : '') + 'всего ' + c.all : ''}` : '';
        html += `<button class="${cls}" data-r="day" data-v="${d}" aria-label="${d === today ? 'сегодня, ' : ''}${shortDate(d)} ${label}"><span>${WD[dt.getDay()]}</span><b>${dt.getDate()}</b><i></i></button>`;
      }
      return `<div class="days">${html}<label class="round cal" aria-label="Выбрать дату">${ICON.cal}<input type="date" id="pickDate" value="${s.day}"></label></div>`;
    },

    card(it, past, markMine) {
      const d = parseDriver(it.transport), plate = d && d.plates[0];
      return `<button class="rq ${past ? 'past' : ''}" data-r="open" data-v="${esc(it.key)}">
        <div class="top"><b>${esc(it.time || '—')}</b><span class="no">${esc(it.no || 'без номера')}</span>
          <span class="right">${markMine && it.mine ? '<i>ваша</i>' : ''}${plate ? `<span class="plate sm">${esc(plate)}</span>` : ''}</span></div>
        <h3>${esc(it.vehicle || 'Транспорт не указан')}</h3>
        <div class="bottom"><div class="addr"><span>${esc(it.from || 'Адрес не указан')}</span></div>${it.day <= todayIso() && it.photo ? `<span class="ph ${it.photo}">${PH_LABEL[it.photo]}</span>` : ''}</div>
      </button>`;
    },

    render() {
      if (screen !== 'req') return; // открыта админка/отчёт/профиль — фоновые ответы не перебивают экран
      if (this.st.view === 'detail') return this.renderDetail();
      const s = this.st, data = s.data, canAll = !data || data.canSeeAll;
      const items = data ? data.items : [];
      const nMine = items.filter(i => i.mine).length;
      const list = this.visible();
      const isToday = s.day === todayIso(), now = nowHM();
      let body;
      if (s.err && !data) body = `<div class="empty">${esc(s.err.message)}<br><br><button class="secondary small" data-r="reload">Повторить</button></div>`;
      if (s.err && data && !s.errShown) { s.errShown = true; setTimeout(() => toast('Не удалось обновить: ' + s.err.message), 0); }
      else if (!data) body = `<div class="list">${['Момент', 'Чуть-чуть', 'Подождать'].map(t => '<div class="skeleton"><span class="moment">' + t + loader(24) + '</span><i></i><i></i><i></i></div>').join('')}</div>`;
      else if (!list.length) {
        const why = s.q || s.fp.size || s.fu.size || s.fph.size ? 'По этим условиям заявок нет.'
          : s.scope === 'mine' ? 'В этот день вас нет в заявках.' : 'На этот день заявок нет.';
        const act = s.q || s.fp.size || s.fu.size || s.fph.size ? `<button class="secondary small" data-r="clear">Сбросить поиск и фильтры</button>` : '';
        // «Показать все заявки дня» — внизу экрана, под большим пальцем
        const all = !act && s.scope === 'mine' && canAll && items.length ? `<div class="report-space"></div><div class="all-bar"><button class="secondary" data-r="scope" data-v="all">Показать все заявки дня · ${items.length}</button></div>` : '';
        body = `<div class="empty">${why}${act ? '<br><br>' + act : ''}</div>${all}`;
      } else {
        // линия «сейчас» (только для сегодняшнего дня): выше — предстоящие, ниже — время подачи уже прошло
        let nowPlaced = !isToday, html = '';
        list.forEach(it => {
          if (!nowPlaced && it.time && it.time < now) { html += `<div class="now"><i></i>сейчас ${now}</div>`; nowPlaced = true; }
          html += this.card(it, false, s.scope === 'all');
        });
        body = `<div class="list">${html}</div>`;
      }
      const PHF = { none:'Без фото', partial:'Частично', full:'Фото есть' };
      const filt = [...s.fp].map(v => `<button data-r="unfp" data-v="${esc(v)}">${esc(v)} ✕</button>`).concat([...s.fu].map(v => `<button data-r="unfu" data-v="${esc(v)}">${esc(v)} ✕</button>`)).concat([...s.fph].map(v => `<button data-r="unfph" data-v="${v}">${PHF[v]} ✕</button>`)).join('');
      setApp(this.head() + this.strip()
        + (canAll ? `<div class="seg slide ${s.scope === 'all' ? 'right' : ''}"><i class="knob"></i><button class="${s.scope === 'mine' ? 'on' : ''}" data-r="scope" data-v="mine">Мои${data ? ` <span class="n">${nMine}</span>` : ''}</button><button class="${s.scope === 'all' ? 'on' : ''}" data-r="scope" data-v="all">Все${data ? ` · ${items.length}` : ''}</button></div>` : '')
        + `<div class="tools"><div class="search compact">${ICON.search}<input class="input" id="rq" placeholder="Номер, адрес, машина" value="${esc(s.q)}"></div>
           <button class="round" data-r="filters" aria-label="Фильтры">${ICON.filter}${s.fp.size + s.fu.size + s.fph.size ? `<span class="dot">${s.fp.size + s.fu.size + s.fph.size}</span>` : ''}</button></div>`
        + (filt ? `<div class="active-filters">${filt}</div>` : '')
        + `<div style="height:16px"></div>`
        + (s.pending && s.pending.length ? s.pending.map(p => { const l = Outbox.label(p); return `<div class="pending-bar glass ${l.err ? 'err' : ''}">
            <div class="pb-head"><b>${l.t}</b>${l.busy ? loader(20) : ''}</div>
            <small>Заявка ${esc(p.item.no || '')} · ${shortDate(p.item.day)} · ${esc(l.sub)}</small>
            ${l.busy ? '' : `<div class="btn-row two"><button class="secondary small" data-r="dropPending" data-v="${esc(p.id)}">Удалить</button><button class="primary small" data-r="sendNow" data-v="${esc(p.id)}">${l.err ? 'Повторить' : 'Отправить сейчас'}</button></div>`}</div>`; }).join('') : '')
        + body
        + (s.sheet ? this.sheetHtml() : ''));
      this.wire();
    },

    paintSheet() {
      const sh = document.querySelector('.sheet');
      if (!this.st.sheet || !sh) return this.render();
      const tmp = document.createElement('div'); tmp.innerHTML = this.sheetHtml();
      const neu = tmp.querySelector('.sheet'), top = sh.scrollTop;
      sh.innerHTML = neu.innerHTML; sh.scrollTop = top;
    },
    /** Шторка уезжает вниз, потом список перерисовывается с выбранными фильтрами. */
    closeSheet() {
      const s = this.st, sh = document.querySelector('.sheet'), bg = document.querySelector('.sheet-bg');
      if (!sh || s.sheetClosing) { s.sheet = false; return this.render(); }
      s.sheetClosing = true;
      sh.classList.remove('enter'); sh.classList.add('closing'); if (bg) bg.classList.add('closing');
      setTimeout(() => { s.sheetClosing = false; s.sheet = false; this.render(); }, 220);
    },
    /** Смахнуть шторку вниз: тянется за пальцем, отпустили ниже 90 px (или резко) — закрывается. */
    wireSheet() {
      const sh = document.querySelector('.sheet'), bg = document.querySelector('.sheet-bg');
      if (!sh || sh.__swipe) return; sh.__swipe = 1;
      let y0 = null, dy = 0, t0 = 0, drag = false;
      sh.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); drag = false; }, { passive: true });
      sh.addEventListener('touchmove', e => {
        if (y0 === null) return;
        const d = e.touches[0].clientY - y0;
        if (!drag) { if (d > 6 && sh.scrollTop <= 0) { drag = true; sh.classList.remove('enter'); sh.classList.add('dragging'); } else if (Math.abs(d) > 6) { y0 = null; return; } else return; }
        dy = Math.max(0, d); sh.style.transform = `translateY(${dy}px)`;
        if (bg) bg.style.opacity = String(Math.max(0.2, 1 - dy / 400));
        if (e.cancelable) e.preventDefault();
      }, { passive: false });
      const end = () => {
        if (y0 === null) return; y0 = null;
        if (!drag) return;
        sh.classList.remove('dragging');
        const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
        if (dy > 90 || fast) return this.closeSheet();
        sh.style.transition = 'transform .2s'; sh.style.transform = ''; if (bg) bg.style.opacity = '';
        setTimeout(() => { sh.style.transition = ''; }, 220);
      };
      sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
    },

    sheetHtml() {
      const s = this.st, items = (s.data && s.data.items || []).filter(it => s.scope === 'all' || it.mine);
      const uniq = k => [...new Set(items.map(i => i[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
      const cnt = (k, v) => items.filter(i => i[k] === v).length;
      const chips = (k, set, act) => uniq(k).map(v => `<button class="chip ${set.has(v) ? 'on' : ''}" data-r="${act}" data-v="${esc(v)}">${esc(v)} <span class="c">${cnt(k, v)}</span></button>`).join('') || '<span class="flag">нет вариантов</span>';
      const enter = s.sheetEnter ? ' enter' : ''; s.sheetEnter = false; // выезжает только при открытии, не при каждом нажатии
      return `<div class="sheet-bg${enter}" data-r="closeSheet"></div><div class="sheet${enter}" role="dialog" aria-label="Фильтры"><div class="grab"></div>
        <h3>Фильтры</h3>
        <p class="sect">Проект</p><div class="chips">${chips('project', s.fp, 'fp')}</div>
        <p class="sect">Назначение</p><div class="chips">${chips('purpose', s.fu, 'fu')}</div>
        <p class="sect">Фотоотчёт</p><div class="chips">${[['none','Без фото'],['partial','Частично'],['full','Фото есть']].map(([v, l]) => `<button class="chip ${s.fph.has(v) ? 'on' : ''}" data-r="fph" data-v="${v}">${l} <span class="c">${items.filter(i => (i.photo === 'arrival' || i.photo === 'departure' ? 'partial' : i.photo || 'none') === v).length}</span></button>`).join('')}</div>
        <div class="btn-row two" style="margin-top:8px"><button class="secondary small" data-r="clear">Сбросить</button><button class="primary small" data-r="closeSheet">Показать · ${this.visible().length}</button></div></div>`;
    },

    async openDetail(key, fresh) {
      screen = 'req';
      const s = this.st, base = ((s.data && s.data.items) || []).find(i => i.key === key);
      const seen = !fresh && local.get('item:' + s.day + ':' + key);
      s.view = 'detail'; s.detailKey = key; s.detail = seen ? { ...seen, photo: base ? base.photo : seen.photo } : base ? { ...base, partial: true } : null;
      window.scrollTo(0, 0);
      setBack(() => this.closeDetail());
      this.render();
      try {
        const r = await api('requests.get', { key, date: s.day });
        local.set('item:' + s.day + ':' + key, r.item);
        if (s.detailKey === key) { s.detail = r.item; if (s.view === 'detail') this.render(); }
      } catch (e) { if (!(e.code === 'OFFLINE' && s.detail)) toast(e.message); if (!s.detail) this.closeDetail(); }
    },
    closeDetail() { this.st.view = 'list'; setBack(null); this.render(); },

    renderDetail() {
      const it = this.st.detail;
      if (!it) { app.innerHTML = loader(48, '', 'margin:30vh auto'); return; }
      const full = !it.partial, drv = parseDriver(it.transport);
      // role — подпись под именем: кто этот человек в заявке
      const contactRows = (text, role) => parseContacts(text).map(c => `<div class="contact"><span class="who"><b>${esc(c.name || 'Без имени')}</b>${role ? `<small>${role}</small>` : ''}</span>${c.href ? `<a class="call" href="${c.href}">${ICON.call}${esc(c.phone)}</a>` : ''}</div>`).join('');
      const stop = (k, addr, contact, end, role) => addr || contact ? `<div class="stop ${end ? 'end' : ''}"><div class="k">${k}</div><div class="addr">${esc(addr || 'Адрес не указан')}</div>${contact ? `<div class="contacts">${contactRows(contact, role)}</div>` : ''}</div>` : '';
      const loadingLine = `<div class="stop-load">${loader(22)}</div>`;
      app.innerHTML = `<div class="topbar"><button class="round" data-r="back" aria-label="Назад">${ICON.back}</button>
          <div class="grow"><h2>${it.no ? 'Заявка ' + esc(it.no) : 'Заявка без номера'}</h2><small>${shortDate(it.day)}${it.time ? ', ' + esc(it.time) : ''}</small></div></div>
        <div class="card glass hero">
          <div class="big">${esc(it.vehicle || 'Транспорт не указан')}</div>
          <div class="sub">${esc([it.project, it.purpose].filter(Boolean).join(' — '))}${it.cargo ? `<br>${/работа по месту/i.test(it.cargo) ? 'Работа по месту' : 'Что везём: ' + esc(it.cargo)}` : ''}</div>
          ${it.roles && it.roles.length ? `<div class="tags">${it.roles.map(r => `<i class="me">вы ${esc(r.replace(/^указан/, 'указаны'))}</i>`).join('')}</div>` : ''}
        </div>
        ${full && it.reports && it.reports.length ? `<p class="sect">Фотоотчёты<small>${it.reports.length}</small></p><div class="card glass"><div class="rep-list">${it.reports.map(r => `<div class="rep-item"><span><b>${esc(r.stage)}${r.time ? ' в ' + esc(r.time) : ''} · ${r.photos ? r.photos + ' фото' : 'без фото'}</b><small>${esc(r.fio)}</small></span><span>${fmtDate(r.at)}</span></div>`).join('')}</div></div>` : ''}
        <p class="sect">Маршрут</p>
        <div class="card glass">
          <div class="stops ${it.to || (full && it.mid) ? '' : 'one'}">
            ${stop(it.to ? 'Подача' : 'Место работы', it.from, full ? it.fromContact : '', !it.to, it.to ? 'встречает на подаче' : 'встречает на месте работы')}
            ${full ? stop('Промежуточный адрес', it.mid, it.midContact, false, 'встречает на промежуточном адресе') : ''}
            ${it.to ? stop('Конечный адрес', it.to, full ? it.toContact : '', true, 'встречает на конечном адресе') : ''}
          </div>
          ${full ? '' : loadingLine}
          ${it.from ? `<div class="map-btns"><button class="secondary small" data-r="map">${ICON.map}Маршрут</button><button class="secondary small" data-r="copy">${ICON.copy}Адрес</button></div>` : ''}
        </div>
        <p class="sect">Машина и водитель</p>
        <div class="card glass">${drv ? `<div class="driver">
            <div class="row">${drv.plates.map(p => `<span class="plate big">${esc(p)}</span>`).join('') || '<span class="flag">номер не распознан</span>'}<span class="model">${esc(drv.model)}</span></div>
            ${drv.name || drv.phones.length ? `<div class="row"><span class="who"><b class="name">${esc(drv.name || 'Имя не указано')}</b><small>водитель</small></span>${drv.phones.map(c => `<a class="call" href="${c.href}">${ICON.call}${esc(c.phone)}</a>`).join('')}</div>` : ''}
            <details><summary>Как записано в заявке</summary><div class="raw">${esc(drv.raw)}</div></details>
          </div>` : `<div class="flag">Машина ещё не назначена</div>`}</div>
        ${full && (it.info || it.extra) ? `<p class="sect">Дополнительно</p><div class="card glass kv">
          ${it.info ? `<div><div class="k">Комментарий</div><div class="v">${esc(it.info)}</div></div>` : ''}
          ${it.extra ? `<div><div class="k">Дополнительные адреса и контакты</div><div class="v">${esc(it.extra)}</div>${parseContacts(it.extra).some(c => c.href) ? `<div class="contacts">${parseContacts(it.extra).filter(c => c.href).map(c => `<div class="contact"><span>${esc(c.name)}</span><a class="call" href="${c.href}">${ICON.call}${esc(c.phone)}</a></div>`).join('')}</div>` : ''}</div>` : ''}
        </div>` : ''}
        ${full && it.initiator ? `<p class="sect">Инициатор заявки</p><div class="card glass"><div class="contacts" style="margin:0">${contactRows(it.initiator, 'оформил заявку')}</div></div>` : ''}
        <div class="report-space"></div>
        <div class="report-bar"><span><small>Фотоотчёт</small><b>${PH_LABEL[it.photo || 'none']}</b></span>
          <button class="primary" data-r="report" ${full ? '' : 'disabled'}>${it.photo === 'full' ? 'Добавить фото' : 'Отчитаться'}</button></div>`;
      this.wire();
    },

    wire() {
      const s = this.st, $ = id => document.getElementById(id);
      app.onclick = e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        const sw = e.target.closest('.days,.seg'); if (sw && sw.__swiped && Date.now() - sw.__swiped < 400) return; // это был жест, а не нажатие
        this.act(b.dataset.r, b.dataset.v, e);
      };
      const q = $('rq'); if (q) q.oninput = e => { s.q = e.target.value; this.render(); };
      const pd = $('pickDate'); if (pd) pd.onchange = e => { if (e.target.value) this.setDay(e.target.value); };
      if (s.sheet) this.wireSheet();
      // «Мои / Все»: ползунок едет за пальцем, отпустили — переключилось
      const seg = document.querySelector('.seg.slide');
      if (seg) {
        const knob = seg.querySelector('.knob');
        hSwipe(seg, {
          move: dx => { const w = knob.offsetWidth; const base = s.scope === 'all' ? w : 0; knob.style.transition = 'none'; knob.style.transform = `translateX(${Math.max(0, Math.min(w, base + dx))}px)`; },
          end: (dx, v) => {
            knob.style.transition = ''; knob.style.transform = '';
            const want = dx < -30 || v < -0.4 ? 'mine' : dx > 30 || v > 0.4 ? 'all' : s.scope;
            this.act('scope', want);
          },
        });
      }
    },

    act(a, v, e) {
      const s = this.st;
      switch (a) {
        case 'day': return this.setDay(v);
        case 'scope': {
          if (s.scope === v) return this.render();
          haptic('select'); s.scope = v; store.set('t26-scope', v);
          // сначала ползунок плавно доезжает, потом меняется список
          const seg = document.querySelector('.seg.slide');
          if (seg) { seg.classList.toggle('right', v === 'all'); seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); clearTimeout(this.segT); this.segT = setTimeout(() => this.render(), 200); return; }
          return this.render();
        }
        case 'open': return this.openDetail(v);
        case 'sendNow':
          if (navigator.onLine === false) return toast('Нет интернета — отчёт уйдёт сам, когда появится связь');
          if (Outbox.st[v]) Outbox.st[v].fails = 0;
          haptic('success'); return Outbox.kick(true);
        case 'dropPending': if (sendingIds.has(v)) return toast('Отчёт сейчас отправляется');
          if (!window.confirm('Удалить неотправленный отчёт? Фото останутся в галерее телефона.')) return;
          Pending.del(v); delete Outbox.st[v]; s.pending = (s.pending || []).filter(x => x.id !== v); return this.render();
        case 'back': return this.closeDetail();
        case 'refresh': {
          if (s.refreshing) return;
          haptic('success'); s.refreshing = true; this.render();
          const t0 = Date.now();
          return this.load(true).then(async () => {
            await sleep(Math.max(0, 600 - (Date.now() - t0))); // чтобы вращение было заметно даже при мгновенном ответе
            s.refreshing = false; this.render();
            toast(s.err ? 'Не удалось обновить: ' + s.err.message : 'Обновлено в ' + nowHM() + ' · заявок: ' + ((s.data && s.data.items.length) || 0));
          });
        }
        case 'reload': return this.load(false);
        case 'filters': s.sheet = true; s.sheetEnter = true; return this.render();
        case 'closeSheet': return this.closeSheet();
        // внутри шторки перерисовываем только её — раньше перерисовывался весь экран и всё мигало
        case 'fp': s.fp.has(v) ? s.fp.delete(v) : s.fp.add(v); haptic('select'); return this.paintSheet();
        case 'fu': s.fu.has(v) ? s.fu.delete(v) : s.fu.add(v); haptic('select'); return this.paintSheet();
        case 'fph': s.fph.has(v) ? s.fph.delete(v) : s.fph.add(v); haptic('select'); return this.paintSheet();
        case 'unfph': s.fph.delete(v); return this.render();
        case 'report': return Report.open(s.detail);
        case 'unfp': s.fp.delete(v); return this.render();
        case 'unfu': s.fu.delete(v); return this.render();
        case 'clear': s.q = ''; s.fp.clear(); s.fu.clear(); s.fph.clear(); s.sheet = false; return this.render();
        case 'admin': return Admin.open();
        case 'profile': return renderProfile();
        case 'map': return openExternal(yandexRoute(s.detail));
        case 'copy': {
          const t = s.detail.from;
          (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Адрес подачи скопирован'), () => toast(t));
          return;
        }
      }
    },
  };

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
  }

  function renderProfile() {
    screen = 'other';
    const p = state.profile || {}, me = state.me || {};
    setBack(() => Req.open());
    app.onclick = null;
    app.innerHTML = `<div class="topbar"><button class="round" id="pBack" aria-label="Назад">${ICON.back}</button>
        <div class="grow"><h2>Профиль</h2><small>${esc(p.role || '')}</small></div>
        <button class="round" data-theme-toggle aria-label="Сменить тему">${document.documentElement.dataset.theme === 'dark' ? ICON.sun : ICON.moon}</button></div>
      ${me.isAdmin ? `<button class="admin-entry" id="openAdmin"><span><b>Админ-панель</b><small>${me.adminPending ? 'Ждут проверки: ' + me.adminPending : 'Сотрудники, рассылка, журнал'}</small></span>${me.adminPending ? `<span class="n">${me.adminPending}</span>` : `<span class="round" style="box-shadow:none">${ICON.shield}</span>`}</button>` : ''}
      ${profileRows(p)}
      <p class="note">Заявки считаются вашими, если в них указан ваш телефон или ФИО. Если вас записывают иначе — попросите администратора добавить вариант написания.</p>`;
    document.getElementById('pBack').onclick = () => Req.open();
    const b = document.getElementById('openAdmin'); if (b) b.onclick = () => Admin.open();
  }

  function route(res) {
    if (res.status === 'new') {
      const t = res.telegram || {};
      try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.allows_write_to_pm) state.form.writeAccess = true; } catch (e) {}
      if (!state.form.firstName && !state.form.lastName) { state.form.firstName = t.firstName || ''; state.form.lastName = t.lastName || ''; }
      renderForm();
    } else if (res.status === 'pending') { state.profile = res.profile; renderPending(res.profile); }
    else if (res.status === 'active') { state.profile = res.profile; state.me = res; Req.open(); }
    else if (res.status === 'rejected') { state.profile = res.profile; renderRejected(res.profile); }
    else if (res.status === 'blocked') renderBlocked();
    else renderError(new Error('Неизвестный статус'));
  }

  async function start() {
    app.onclick = null;
    if (!inTelegram && !demo) return renderOutside();
    // Сразу показываем то, что было в прошлый раз (если доступ был открыт), и параллельно спрашиваем сервер.
    local.prune();
    const saved = local.get('me');
    const day = todayIso();
    let shown = false;
    if (saved && saved.status === 'active') { state.profile = saved.profile; state.me = saved; Req.open(day, { wait: true }); shown = true; }
    else renderLoading();
    try {
      const r = await api('boot', { date: day });
      const me = { ...r }; delete me.list; delete me.listError;
      local.set('me', me);
      if (r.status === 'active') {
        state.profile = r.profile; state.me = me;
        if (!shown) Req.open(day, { wait: true });
        else if (Req.st.view === 'list') Req.render(); // могли обновиться права и счётчик админки
        if (r.list) Req.receive(r.list);
        else { Req.st.err = new Error(r.listError || 'Не удалось загрузить заявки'); Req.st.loading = false; if (Req.st.view === 'list') Req.render(); }
        Outbox.kick(); // неотправленные отчёты уходят сами
      } else {
        route(r); // статус изменился (заблокирован, ждёт подтверждения…) — показываем нужный экран
      }
    } catch (e) {
      if (!shown) return renderError(e);
      Req.st.err = e; Req.st.loading = false;
      if (Req.st.view === 'list') Req.render();
    }
  }

  Metrics.init();
  Outbox.init();
  start();
})();
</script>
</body>
</html>
