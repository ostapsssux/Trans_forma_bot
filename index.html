        ${full && (it.info || it.extra) ? `<p class="sect">Дополнительно</p><div class="card glass kv">
          ${it.info ? `<div><div class="k">Комментарий</div><div class="v">${esc(it.info)}</div></div>` : ''}
          ${it.extra ? `<div><div class="k">Дополнительные адреса и контакты</div><div class="v">${esc(it.extra)}</div>${parseContacts(it.extra).some(c => c.href) ? `<div class="contacts">${parseContacts(it.extra).filter(c => c.href).map(c => `<div class="contact"><span>${esc(c.name)}</span><a class="call" href="${c.href}">${ICON.call}${esc(c.phone)}</a></div>`).join('')}</div>` : ''}</div>` : ''}
        </div>` : ''}
        ${full && it.initiator ? `<p class="sect">Инициатор заявки</p><div class="card glass"><div class="contacts" style="margin:0">${contactRows(it.initiator, 'оформил заявку')}</div></div>` : ''}
        ${full && it.stamp ? `<p class="note">Заявка подана ${esc(it.stamp)}</p>` : ''}`;
      this.wire();
    },

    wire() {
      const s = this.st, $ = id => document.getElementById(id);
      app.onclick = e => { const b = e.target.closest('[data-r]'); if (b) this.act(b.dataset.r, b.dataset.v, e); };
      const q = $('rq'); if (q) q.oninput = e => { s.q = e.target.value; const pos = e.target.selectionStart; this.render(); const n = $('rq'); n.focus(); n.setSelectionRange(pos, pos); };
      const pd = $('pickDate'); if (pd) pd.onchange = e => { if (e.target.value) this.setDay(e.target.value); };
    },

    act(a, v, e) {
      const s = this.st;
      switch (a) {
        case 'day': return this.setDay(v);
        case 'scope': s.scope = v; store.set('t26-scope', v); return this.render();
        case 'open': return this.openDetail(v);
        case 'back': return this.closeDetail();
        case 'refresh': haptic('success'); toast('Обновляем заявки…'); return this.load(true).then(() => this.st.data && toast('Обновлено в ' + nowHM()));
        case 'reload': return this.load(false);
        case 'filters': s.sheet = true; return this.render();
        case 'closeSheet': s.sheet = false; return this.render();
        case 'fp': s.fp.has(v) ? s.fp.delete(v) : s.fp.add(v); return this.render();
        case 'fu': s.fu.has(v) ? s.fu.delete(v) : s.fu.add(v); return this.render();
        case 'unfp': s.fp.delete(v); return this.render();
        case 'unfu': s.fu.delete(v); return this.render();
        case 'clear': s.q = ''; s.fp.clear(); s.fu.clear(); s.sheet = false; return this.render();
        case 'admin': return Admin.open();
        case 'profile': return renderProfile();
        case 'map': return openExternal(yandexRoute(s.detail.from, s.detail.to));
        case 'copy': {
          const t = s.detail.from;
          (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Адрес подачи скопирован'), () => toast(t));
          return;
        }
      }
    },
  };

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
  }

  function renderProfile() {
    const p = state.profile || {}, me = state.me || {};
    setBack(() => Req.open());
    app.onclick = null;
    app.innerHTML = `<div class="topbar"><button class="round" id="pBack" aria-label="Назад">${ICON.back}</button>
        <div class="grow"><h2>Профиль</h2><small>${esc(p.role || '')}</small></div>
        <button class="round" data-theme-toggle aria-label="Сменить тему">${document.documentElement.dataset.theme === 'dark' ? ICON.sun : ICON.moon}</button></div>
      ${me.isAdmin ? `<button class="admin-entry" id="openAdmin"><span><b>Админ-панель</b><small>${me.adminPending ? 'Ждут проверки: ' + me.adminPending : 'Сотрудники, рассылка, журнал'}</small></span>${me.adminPending ? `<span class="n">${me.adminPending}</span>` : `<span class="round" style="box-shadow:none">${ICON.shield}</span>`}</button>` : ''}
      ${profileRows(p)}
      <p class="note">Заявки считаются вашими, если в них указан ваш телефон или ФИО. Если вас записывают иначе — попросите администратора добавить вариант написания.</p>`;
    document.getElementById('pBack').onclick = () => Req.open();
    const b = document.getElementById('openAdmin'); if (b) b.onclick = () => Admin.open();
  }

  function route(res) {
    if (res.status === 'new') {
      const t = res.telegram || {};
      try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.allows_write_to_pm) state.form.writeAccess = true; } catch (e) {}
      if (!state.form.firstName && !state.form.lastName) { state.form.firstName = t.firstName || ''; state.form.lastName = t.lastName || ''; }
      renderForm();
    } else if (res.status === 'pending') { state.profile = res.profile; renderPending(res.profile); }
    else if (res.status === 'active') { state.profile = res.profile; state.me = res; Req.open(); }
    else if (res.status === 'rejected') { state.profile = res.profile; renderRejected(res.profile); }
    else if (res.status === 'blocked') renderBlocked();
    else renderError(new Error('Неизвестный статус'));
  }

  async function start() {
    app.onclick = null;
    if (!inTelegram && !demo) return renderOutside();
    renderLoading();
    try { route(await api('me')); } catch (e) { renderError(e); }
  }

  start();
})();
</script>
</body>
</html>
