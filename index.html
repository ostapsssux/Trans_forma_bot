    st: { view:'list', tab:'staff', filter:'pending', q:'', staff:[], me:'', sel:null, matches:{}, showAll:false,
          rec:new Set(), text:'', withButton:true, pickQ:'', result:null, history:null, logTab:'log', busy:false, reject:false, reason:'' },

    /** Свежий список с сервера (несколько админов: чужие изменения подтягиваются сами). */
    async refresh() {
      const s = this.st;
      if (!s.open || s.refreshing || s.busy) return;
      s.refreshing = true;
      try {
        const r = await api('admin.staff');
        if (!s.busy) { s.staff = r.staff; s.me = r.me; local.set('admin-staff', { staff: r.staff, me: r.me }); if (s.open) this.render(); }
      } catch (e) { /* тихо: попробуем при следующем обновлении */ }
      s.refreshing = false;
    },

    async open() {
      screen = 'admin';
      this.st.open = true;
      clearInterval(this.timer); this.timer = setInterval(() => this.refresh(), 45000); // раз в 45 с, пока админка открыта
      document.body.classList.add('wide');
      // сразу показываем сохранённый с прошлого раза список, свежий подменяет его через 1–2 с
      const saved = local.get('admin-staff');
      if (saved && saved.staff) {
        this.st.staff = saved.staff; this.st.me = saved.me; this.st.view = 'list'; this.st.stale = true;
        if (!this.st.staff.some(x => x.status === 'pending')) this.st.filter = 'all';
        this.render();
      } else renderLoading('Загружаем сотрудников…');
      try {
        const r = await api('admin.staff');
        local.set('admin-staff', { staff: r.staff, me: r.me });
        const first = !saved;
        this.st.staff = r.staff; this.st.me = r.me; this.st.stale = false;
        if (!this.st.staff.some(x => x.status === 'pending') && this.st.filter === 'pending') this.st.filter = 'all';
        if (this.st.view === 'list' || first) { if (first) this.st.view = 'list'; this.render(); }
      } catch (e) { if (saved && saved.staff && e.code !== 'FORBIDDEN') { this.st.stale = false; toast('Не удалось обновить: ' + e.message); } else this.fail(e); }
    },
    close() {
      this.st.open = false; clearInterval(this.timer); screen = '';
      document.body.classList.remove('wide');
      setBack(null);
      start();
    },
    fail(e) { if (e.code === 'FORBIDDEN') { toast(e.message); this.close(); } else renderError(e); },
    get(id) { return this.st.staff.find(x => x.tgId === String(id)); },
    put(x) {
      const i = this.st.staff.findIndex(y => y.tgId === x.tgId);
      if (i >= 0) this.st.staff[i] = { ...this.st.staff[i], ...x };
      local.set('admin-staff', { staff: this.st.staff, me: this.st.me }); // сохранённая копия — всегда как на экране
    },

    back() {
      const s = this.st;
      if (s.view === 'person') { s.view = 'list'; s.reject = false; }
      else if (s.view === 'pick') { s.view = 'list'; s.tab = 'send'; }
      else return this.close();
      this.render();
    },
    setBack() { setBack(() => Admin.back()); },

    top(title, sub) {
      return `<div class="topbar"><button class="round" data-a="back" aria-label="Назад">${ICON.back}</button>
        <div class="grow"><h2>${esc(title)}</h2>${sub ? `<small>${sub}</small>` : ''}</div>
        <button class="round" data-theme-toggle aria-label="Сменить тему">${document.documentElement.dataset.theme === 'dark' ? ICON.sun : ICON.moon}</button></div>`;
    },
    tabs() {
      const n = this.st.staff.filter(x => x.status === 'pending').length;
      const t = (id, label, extra='') => `<button class="${this.st.tab === id ? 'on' : ''}" data-a="tab" data-v="${id}">${label}${extra}</button>`;
      return `<div class="seg">${t('staff','Сотрудники', n ? `<span class="n">${n}</span>` : '')}${t('send','Рассылка')}${t('log','Журнал')}</div>`;
    },

    render() {
      if (screen !== 'admin') return;
      this.setBack();
      const s = this.st;
      let html;
      if (s.view === 'person') html = this.viewPerson();
      else if (s.view === 'pick') html = this.viewPick();
      else html = this.top('Админ-панель', esc(state.profile ? state.profile.fio : '')) + this.tabs()
        + (s.tab === 'staff' ? this.viewList() : s.tab === 'send' ? this.viewSend() : this.viewLog());
      setApp(html);
      this.wire();
    },

    /* ---------- сотрудники ---------- */
    filtered() {
      const s = this.st, q = s.q.trim().toLowerCase(), qd = digits(q);
      const order = { pending:0, rejected:1, active:2, blocked:3 };
      return s.staff
        .filter(x => s.filter === 'all' || x.status === s.filter)
        .filter(x => !q || x.fio.toLowerCase().includes(q) || (x.username || '').toLowerCase().includes(q.replace('@','')) || (qd.length >= 3 && digits(x.phone).includes(qd)))
        .sort((a, b) => order[a.status] - order[b.status] || (a.status === 'pending' ? String(b.registered).localeCompare(String(a.registered)) : a.fio.localeCompare(b.fio, 'ru')));
    },
    flags(x) {
      const f = [];
      if (x.phoneVerified) f.push(`<span class="flag ok">${ICON.tgok}номер из Telegram</span>`);
      else f.push(`<span class="flag">номер вручную</span>`);
      if (/⚠ Телефон уже/.test(x.comment)) f.push(`<span class="flag warn">${ICON.warn}телефон у другого</span>`);
      if (!x.canWrite) f.push(`<span class="flag bad">${ICON.mute}бот не может писать</span>`);
      return f.join('');
    },
    viewList() {
      const s = this.st, cnt = st => s.staff.filter(x => x.status === st).length;
      const chip = (v, label, c) => `<button class="chip ${s.filter === v ? 'on' : ''}" data-a="filter" data-v="${v}">${label}${c !== undefined ? ` <span class="c">${c}</span>` : ''}</button>`;
      const list = this.filtered();
      return `<div class="search">${ICON.search}<input class="input" id="q" placeholder="ФИО, телефон или @username" value="${esc(s.q)}"></div>
        <div class="chips">${chip('pending','Ожидают',cnt('pending'))}${chip('active','Активные',cnt('active'))}${chip('rejected','Отклонённые',cnt('rejected'))}${chip('blocked','Заблокированы',cnt('blocked'))}${chip('all','Все',s.staff.length)}</div>
        <div class="list two">${list.map(x => `
          <button class="person" data-a="person" data-v="${x.tgId}">
            <div class="row1"><b>${esc(x.fio)}</b><span class="pill ${x.status}">${STATUS_RU[x.status]}</span></div>
            <div class="sub"><span>${esc(fmtPhone(x.phone) || x.phone)}</span>${x.role !== 'Сотрудник' ? `<span>${esc(x.role)}</span>` : ''}<span>заявок: ${Math.max(+x.byPhone || 0, +x.byName || 0)}</span></div>
            <div class="sub">${this.flags(x)}</div>
          </button>`).join('') || `<div class="empty">Никого не найдено</div>`}</div>`;
    },

    viewPerson() {
      const s = this.st, x = this.get(s.sel), m = s.matches[x.tgId];
      const self = x.tgId === s.me;
      const notes = String(x.comment || '').split(';').map(t => t.trim()).filter(Boolean);
      const items = m && m.items ? (s.showAll ? m.items : m.items.slice(0, 6)) : [];
      const roleSeg = ['Сотрудник','Логист','Администратор'].map(r => `<button class="${x.role === r ? 'on' : ''}" data-a="role" data-v="${r}" ${self && r !== 'Администратор' ? 'disabled' : ''}>${r}</button>`).join('');
      let actions = '';
      if (x.status === 'pending' || x.status === 'rejected') actions = s.reject ? '' : `<div class="btn-row two"><button class="primary" data-a="approve">Утвердить</button><button class="secondary" data-a="rejectOpen">Отклонить</button></div>`;
      if (x.status === 'active') actions = `<div class="btn-row ${self ? '' : 'two'}"><button class="secondary" data-a="write">Написать</button>${self ? '' : `<button class="secondary danger" data-a="blockOpen">Заблокировать</button>`}</div>`;
      if (x.status === 'blocked') actions = `<div class="btn-row"><button class="primary" data-a="approve">Разблокировать</button></div>`;
      if (s.busy) actions = `<div class="saving">${loader(20)}Сохраняем…</div>`;
      const reasonBox = s.reject ? `<div class="card glass reasonbox">
          <p class="sect">${s.reject === 'block' ? 'Причина блокировки' : 'Причина отказа'}<small>${s.reject === 'block' ? 'необязательно' : 'увидит сотрудник'}</small></p>
          <textarea class="input area" id="reason" placeholder="${s.reject === 'block' ? 'Например: больше не работает в компании' : 'Например: не нашли вас в заявках — укажите рабочий номер'}">${esc(s.reason)}</textarea>
          <div class="btn-row two" style="margin-top:16px"><button class="secondary small" data-a="rejectCancel">Отмена</button><button class="primary small" data-a="${s.reject === 'block' ? 'block' : 'reject'}">${s.reject === 'block' ? 'Заблокировать' : 'Отправить отказ'}</button></div></div>` : '';
      return this.top(x.fio, `<span class="pill ${x.status}">${STATUS_RU[x.status]}</span>`) + `
        <div class="card glass rows">
          <div><span>Телефон</span><strong>${esc(fmtPhone(x.phone) || x.phone)}<br><small style="font-weight:400;color:var(--muted)">${x.phoneVerified ? 'подтверждён Telegram' : 'введён вручную'}</small></strong></div>
          <div><span>Telegram</span><strong>${x.username ? '@' + esc(String(x.username).replace('@','')) + ' · ' : ''}ID ${esc(x.tgId)}</strong></div>
          <div><span>Бот может писать</span><strong>${x.canWrite ? 'да' : '<span style="color:var(--danger)">нет</span>'}</strong></div>
          <div><span>Зарегистрирован</span><strong>${fmtDate(x.registered)}</strong></div>
          ${x.changedBy ? `<div><span>Изменил</span><strong>${esc(x.changedBy)} · ${fmtDate(x.updated)}</strong></div>` : ''}
        </div>
        ${notes.length || x.adminNote ? `<div class="card glass"><div class="notes">
          ${notes.map(n => `<div>${ICON.warn}<span>${esc(n.replace(/^⚠\s*/,''))}</span></div>`).join('')}
          ${x.adminNote ? `<div class="ans">${ICON.reply}<span><b>Ответ сотруднику:</b> ${esc(x.adminNote)}</span></div>` : ''}
        </div></div>` : ''}
        ${actions}${reasonBox}
        <div style="height:22px"></div>
        <p class="sect">Найденные заявки<small>последние ${m && m.items ? m.items.length : '…'}</small></p>
        <div class="card glass">${!m ? loader(32, '', 'margin:10px auto') : `
          <div class="counts"><div><strong>${m.byPhone}</strong><span>по телефону</span></div><div><strong>${m.byName}</strong><span>по ФИО</span></div><div><strong>${m.byAlias}</strong><span>по вариантам</span></div></div>
          ${m.window ? `<p class="note" style="margin:8px 0 0">Заявки с ${shortDate(m.window.from)} по ${shortDate(m.window.to)}</p>` : ''}
          ${items.map(i => `<div class="match"><div class="t">${esc(i.no || 'без №')}<span>${esc(String(i.date).slice(0,16))}</span></div>
            <div class="d">${esc(i.project)} · ${esc(i.purpose)}</div>
            <div class="m">${esc(i.from)}${i.initiator ? ' · инициатор: ' + esc(i.initiator) : ''}</div>
            <div class="tags">${i.how.map(h => `<i>${esc(h)}</i>`).join('')}</div></div>`).join('') || `<div class="empty">Заявок с этим телефоном или ФИО не найдено</div>`}
          ${m.items && m.items.length > 6 && !s.showAll ? `<button class="secondary small" data-a="more">Показать все ${m.items.length}</button>` : ''}`}
        </div>
        <p class="sect">Роль</p>
        <div class="seg">${roleSeg}</div>
        <p class="sect">Как записывают в заявках<small>через ;</small></p>
        <div class="card glass">
          <div class="inline"><input class="input" id="aliases" placeholder="Например: Юля Смирнова; Смирнова Ю." value="${esc(x.aliases)}"><button class="primary small" data-a="saveAliases">Сохранить</button></div>
          <p class="note" style="text-align:left;margin:10px 10px 0">Если сотрудника пишут в заявках по-разному, добавьте варианты — заявки найдутся и по ним.</p>
        </div>`;
    },

    async loadMatches(id) {
      const saved = local.get('admin-m:' + id);
      if (saved && !this.st.matches[id]) { this.st.matches[id] = saved; if (this.st.view === 'person' && this.st.sel === id) this.render(); }
      try { const r = await api('admin.matches', { tgId:id }); this.st.matches[id] = r.matches; local.set('admin-m:' + id, r.matches);
        this.put({ tgId:id, byPhone:r.matches.byPhone, byName:r.matches.byName }); }
      catch (e) { this.st.matches[id] = { byPhone:'—', byName:'—', byAlias:'—', items:[] }; toast(e.message); }
      if (this.st.view === 'person' && this.st.sel === id) this.render();
    },

    async setStatus(status, reason = '') {
      const s = this.st, x = this.get(s.sel);
      if (!x || s.busy) return;
      const before = { ...x };
      // сразу показываем новый статус и «Сохраняем…»; если сервер не принял — возвращаем как было
      s.busy = status; s.reject = false;
      this.put({ tgId: x.tgId, status, adminNote: reason });
      this.render();
      try {
        const r = await api('admin.setStatus', { tgId: x.tgId, status, reason, expect: before.status });
        this.put(r.staff); s.reason = '';
        if (r.conflict) { haptic('error'); toast('Статус уже изменил ' + (r.by || 'другой админ') + ': ' + STATUS_RU[r.staff.status].toLowerCase()); }
        else if (r.already) { haptic('success'); toast('Уже ' + STATUS_RU[r.staff.status].toLowerCase() + (r.by ? ' — изменил ' + r.by : '')); }
        else { haptic('success'); toast(({ active:'Доступ открыт', rejected:'Отказ отправлен', blocked:'Заблокирован' })[status] + (r.delivered ? ' · сообщение доставлено' : ' · не доставлено: ' + (r.error || 'ошибка'))); }
      } catch (e) { this.put(before); haptic('error'); toast('Не сохранилось: ' + e.message); }
      s.busy = false; this.render();
    },

    /* ---------- рассылка ---------- */
    viewSend() {
      const s = this.st, rec = [...s.rec].map(id => this.get(id)).filter(Boolean);
      const mute = rec.filter(x => !x.canWrite).length;
      return `<p class="sect">Получатели<small>${rec.length ? 'выбрано: ' + rec.length : 'не выбраны'}</small></p>
        <div class="card glass">
          ${rec.length ? `<div class="tags" style="margin:0 0 14px">${rec.slice(0, 12).map(x => `<i>${esc(shortName(x.fio))}</i>`).join('')}${rec.length > 12 ? `<i>ещё ${rec.length - 12}</i>` : ''}</div>` : ''}
          ${mute ? `<div class="notes" style="margin-bottom:14px"><div>${ICON.mute}<span>${mute} из выбранных запретили боту писать — им сообщение может не дойти</span></div></div>` : ''}
          <button class="secondary small" style="margin:0" data-a="pick">${rec.length ? 'Изменить получателей' : 'Выбрать получателей'}</button>
        </div>
        <p class="sect">Сообщение<small>шаблоны</small></p>
        <div class="chips">${TEMPLATES.map((t, i) => `<button class="chip" data-a="tpl" data-v="${i}">${t[0]}</button>`).join('')}</div>
        <div class="card glass">
          <textarea class="input area" id="msg" maxlength="3500" placeholder="Текст сообщения сотрудникам">${esc(s.text)}</textarea>
          <div class="counter" id="cnt">${s.text.length} / 3500</div>
          <label class="consent" style="padding-bottom:0"><input type="checkbox" id="withButton" ${s.withButton ? 'checked' : ''}><span>Добавить кнопку «Открыть приложение»</span></label>
        </div>
        <p class="note" style="margin:-8px 8px 18px;text-align:left">Сотрудник увидит: «Сообщение от администратора», ваш текст и подпись «— ${esc(state.profile ? state.profile.fio : '')}».</p>
        <button class="primary" data-a="send" ${s.busy ? 'disabled' : ''}>${s.busy ?  loader(20, 'on') + 'Отправляем…' : 'Отправить' + (rec.length ? ' · ' + rec.length : '')}</button>
        ${s.result ? `<div class="card glass" style="margin-top:22px"><div class="result">
          <div class="big">Доставлено ${s.result.sent} из ${s.result.total}</div>
          ${s.result.results.filter(r => !r.ok).map(r => `<div class="logi"><div class="t"><b>${esc(r.fio || r.tgId)}</b></div><div class="e">${esc(r.error)}</div></div>`).join('')}
        </div></div>` : ''}`;
    },
    viewPick() {
      const s = this.st, q = s.pickQ.trim().toLowerCase();
      const people = s.staff.filter(x => x.status === 'active' && (!q || x.fio.toLowerCase().includes(q)))
        .sort((a, b) => a.fio.localeCompare(b.fio, 'ru'));
      return this.top('Получатели', 'выбрано: ' + s.rec.size) + `
        <div class="search">${ICON.search}<input class="input" id="pq" placeholder="Поиск по ФИО" value="${esc(s.pickQ)}"></div>
        <div class="chips">
          <button class="chip" data-a="pickAll">Все активные</button>
          <button class="chip" data-a="pickRole" data-v="Логист">Логисты</button>
          <button class="chip" data-a="pickRole" data-v="Администратор">Администраторы</button>
          <button class="chip" data-a="pickNone">Очистить</button>
        </div>
        <div class="card glass" style="padding:8px 18px">${people.map(x => `
          <label class="pick"><span><b>${esc(x.fio)}</b><small>${esc(x.role)}${x.canWrite ? '' : ' · бот не может писать'}</small></span>
          <input type="checkbox" class="toggle" data-pick="${x.tgId}" ${s.rec.has(x.tgId) ? 'checked' : ''}></label>`).join('') || `<div class="empty">Нет активных сотрудников</div>`}
        </div>
        <div class="sticky"><button class="primary" data-a="pickDone">Готово · ${s.rec.size}</button></div>`;
    },

    /* ---------- журнал ---------- */
    viewLog() {
      const s = this.st, h = s.history;
      const seg = `<div class="seg"><button class="${s.logTab === 'log' ? 'on' : ''}" data-a="logTab" data-v="log">Действия</button><button class="${s.logTab === 'msg' ? 'on' : ''}" data-a="logTab" data-v="msg">Сообщения</button></div>`;
      if (!h) return seg + `<div class="mid-load">${loader(40)}</div>`;
      const label = a => ({ 'admin.status':'Смена статуса', 'admin.update':'Изменение данных', 'admin.send':'Рассылка', 'register':'Регистрация', 'status':'Статус изменён в таблице' })[a] || a;
      const rows = s.logTab === 'log'
        ? h.log.map(l => `<div class="logi"><div class="t"><b>${esc(label(l.action))}${l.result ? ' · ' + esc(l.result) : ''}</b><span>${fmtDate(l.time)}</span></div><div class="d">${esc(l.by)} — ${esc(l.details)}</div></div>`)
        : h.notifications.map(n => `<div class="logi"><div class="t"><b>${esc(n.to)}</b><span>${fmtDate(n.time)}</span></div><div class="d">${esc(n.text)}</div>${n.ok ? `<div class="m" style="color:var(--ok);font-size:12.5px;margin-top:3px">доставлено · отправил ${esc(n.by)}</div>` : `<div class="e">не доставлено: ${esc(n.error)}</div>`}</div>`);
      return seg + `<div class="card glass" style="padding:6px 20px">${rows.join('') || '<div class="empty">Пока пусто</div>'}</div>
        <button class="secondary small" data-a="reloadLog">Обновить</button>`;
    },
    async loadHistory() {
      try { this.st.history = await api('admin.history'); } catch (e) { this.st.history = { log:[], notifications:[] }; toast(e.message); }
      if (this.st.tab === 'log' && this.st.view === 'list') this.render();
    },

    /* ---------- события ---------- */
    wire() {
      const s = this.st, $ = id => document.getElementById(id);
      app.onclick = e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) this.act(b.dataset.a, b.dataset.v); };
      const q = $('q'); if (q) q.oninput = e => { s.q = e.target.value; this.render(); };
      const pq = $('pq'); if (pq) pq.oninput = e => { s.pickQ = e.target.value; this.render(); };
      const msg = $('msg'); if (msg) msg.oninput = e => { s.text = e.target.value; $('cnt').textContent = s.text.length + ' / 3500'; };
      const wb = $('withButton'); if (wb) wb.onchange = e => { s.withButton = e.target.checked; };
      const rs = $('reason'); if (rs) rs.oninput = e => { s.reason = e.target.value; };
      document.querySelectorAll('[data-pick]').forEach(t => t.onchange = e => { const id = e.target.dataset.pick; e.target.checked ? s.rec.add(id) : s.rec.delete(id);
        document.querySelector('.topbar small').textContent = 'выбрано: ' + s.rec.size; document.querySelector('[data-a="pickDone"]').textContent = 'Готово · ' + s.rec.size; });
    },

    async act(a, v) {
      const s = this.st;
      switch (a) {
        case 'back': return this.back();
        case 'tab': s.tab = v; s.view = 'list'; if (v === 'log' && !s.history) this.loadHistory(); return this.render();
        case 'filter': s.filter = v; return this.render();
        case 'person': s.sel = v; s.view = 'person'; s.reject = false; s.reason = ''; s.showAll = false; window.scrollTo(0, 0);
          this.render(); this.loadMatches(v); return; // сохранённое — сразу, свежее — фоном
        case 'more': s.showAll = true; return this.render();
        case 'approve': {
          const x = this.get(s.sel);
          if (!await confirmDlg(`Открыть доступ: ${x.fio}?`)) return;
          return this.setStatus('active');
        }
        case 'rejectOpen': s.reject = 'reject'; return this.render();
        case 'blockOpen': s.reject = 'block'; return this.render();
        case 'rejectCancel': s.reject = false; s.reason = ''; return this.render();
        case 'reject':
          if (!s.reason.trim()) { toast('Напишите причину — её увидит сотрудник'); haptic('error'); return; }
          return this.setStatus('rejected', s.reason);

  /* =================== ФОТО: метаданные, отпечаток, сжатие =================== */
  const PH_LABEL = { none:'Без фото', arrival:'Только прибытие', departure:'Только убытие', full:'Фото есть' };
  const STAGE_LABEL = { arrival:'Прибытие', departure:'Убытие' };

  /** EXIF из JPEG: время съёмки, производитель, модель, программа, GPS. Читаем ДО сжатия — при сжатии всё стирается. */
  function readExif(buf) {
    const out = { hasExif: false };
    const v = new DataView(buf);
    if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return out;
    let off = 2;
    while (off + 10 < v.byteLength) {
      const marker = v.getUint16(off), len = v.getUint16(off + 2);
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) { try { parseTiff(v, off + 10, out); } catch (e) {} break; }
      if ((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) break;
      off += 2 + len;
    }
    return out;
  }
  function parseTiff(v, t, out) {
    const le = v.getUint16(t) === 0x4949;
    const u16 = o => v.getUint16(t + o, le), u32 = o => v.getUint32(t + o, le);
    const str = (o, n) => { let r = ''; for (let i = 0; i < n && t + o + i < v.byteLength; i++) { const c = v.getUint8(t + o + i); if (!c) break; r += String.fromCharCode(c); } return r.trim(); };
    const rat = o => u32(o) / (u32(o + 4) || 1);
    const ifd = o => {
      const tags = {};
      if (!o || t + o + 2 > v.byteLength) return tags;
      const n = u16(o);
      for (let i = 0; i < n && i < 300; i++) {
        const e = o + 2 + i * 12;
        if (t + e + 12 > v.byteLength) break;
        const type = u16(e + 2), cnt = u32(e + 4);
        const size = ({ 1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8 })[type] || 1;
        tags[u16(e)] = { type, cnt, at: size * cnt > 4 ? u32(e + 8) : e + 8, raw: e + 8 };
      }
      return tags;
    };
    const s = (g, tag) => g[tag] && g[tag].type === 2 ? str(g[tag].at, g[tag].cnt) : '';
    out.hasExif = true;
    const i0 = ifd(u32(4));
    out.make = s(i0, 0x010F); out.model = s(i0, 0x0110); out.software = s(i0, 0x0131);
    // Три разных времени, не путаем:
    //  taken    — момент съёмки (DateTimeOriginal, иначе DateTimeDigitized) — пишет камера при нажатии на кнопку;
    //  modified — когда файл последний раз сохраняли (DateTime) — меняется после редактирования;
    //  время загрузки в систему ставит сервер, телефон его не присылает.
    const norm = x => x.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3');
    const modified = s(i0, 0x0132);
    if (modified) out.modified = norm(modified);
    if (i0[0x8769]) {
      const ex = ifd(u32(i0[0x8769].raw));
      const taken = s(ex, 0x9003) || s(ex, 0x9004);
      if (taken) out.taken = norm(taken);
      const tz = s(ex, 0x9011) || s(ex, 0x9012);
      if (/^[+-]\d{2}:\d{2}$/.test(tz)) out.tz = tz;
    }
    if (i0[0x8825]) {
      const g = ifd(u32(i0[0x8825].raw));
      const coord = (tag, ref) => {
        if (!g[tag] || g[tag].type !== 5 || g[tag].cnt < 3) return null;
        const o = g[tag].at, d = rat(o) + rat(o + 8) / 60 + rat(o + 16) / 3600;
        return /[SW]/.test(s(g, ref)) ? -d : d;
      };
      const lat = coord(2, 1), lon = coord(4, 3);
      if (lat !== null && lon !== null && isFinite(lat) && isFinite(lon) && !(lat === 0 && lon === 0)) { out.lat = +lat.toFixed(6); out.lon = +lon.toFixed(6); }
    }
  }

  async function loadBitmap(file) {
    if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {} }
    return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('bad image')); img.src = URL.createObjectURL(file); });
  }
  const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');

  /** «Отпечаток» фото (dHash 64 бита): одинаковые и почти одинаковые снимки дают близкие коды — так ловим повторы. */
  function dHash(img) {
    // сначала мягко уменьшаем до 90×80, затем усредняем блоки 10×10 → сетка 9×8 (устойчиво к сжатию и масштабу)
    const c = document.createElement('canvas'); c.width = 90; c.height = 80;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, 90, 80);
    const d = x.getImageData(0, 0, 90, 80).data;
    const cell = (cx, cy) => { let sum = 0; for (let y = cy * 10; y < cy * 10 + 10; y++) for (let k = cx * 10; k < cx * 10 + 10; k++) { const i = (y * 90 + k) * 4; sum += d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114; } return sum; };
    let bits = '';
    for (let cy = 0; cy < 8; cy++) for (let cx = 0; cx < 8; cx++) bits += cell(cx, cy) < cell(cx + 1, cy) ? '1' : '0';
    let h = ''; for (let i = 0; i < 64; i += 4) h += parseInt(bits.slice(i, i + 4), 2).toString(16);
    return h;
  }

  /** Файл с телефона → { blob (сжатый JPEG), url (превью), meta }. */
  async function processPhoto(file) {
    const buf = await file.arrayBuffer();
    const exif = readExif(buf);
    let sha = '';
    try { sha = hex(await crypto.subtle.digest('SHA-256', buf)); } catch (e) {}
    const img = await loadBitmap(file);
    const W = img.width || img.naturalWidth, H = img.height || img.naturalHeight;
    const k = Math.min(1, 1440 / Math.max(W, H)); // 1440 px: штамп читается, файл ~150–250 КБ
    const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    if (!blob) throw new Error('compress failed');
    const meta = { ...exif, sha, dhash: dHash(img), w: c.width, h: c.height, origBytes: file.size, origType: file.type || '',
      fileModified: file.lastModified ? new Date(file.lastModified).toISOString() : '' };
    return { blob, url: URL.createObjectURL(blob), meta };
  }
  const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });

  /** Геопозиция телефона в момент отправки (Telegram LocationManager, иначе браузер). Не обязательна. */
  function getLocation() {
    return new Promise(res => {
      const done = v => { clearTimeout(t); res(v); };
      const t = setTimeout(() => res(null), 9000);
      try {
        const lm = tg && tg.LocationManager;
        if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) {
          const ask = () => lm.getLocation(d => done(d ? { lat: d.latitude, lon: d.longitude, acc: d.horizontal_accuracy || null } : null));
          return lm.isInited ? ask() : lm.init(() => (lm.isLocationAvailable ? ask() : done(null)));
        }
      } catch (e) {}
      if (!navigator.geolocation) return done(null);
      navigator.geolocation.getCurrentPosition(p => done({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }), () => done(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    });
  }
  const newReportId = () => { const a = new Uint8Array(8); crypto.getRandomValues(a); return hex(a.buffer); };

  /* =================== ЭКРАН ФОТООТЧЁТА =================== */
  /**
   * Прямая загрузка фото в Google Диск по одноразовой ссылке, которую выдал сервер (без Apps Script и base64).
   * onp(доля 0…1) — настоящий прогресс отправки. При любой ошибке — reject с code 'DIRECT' (вызывающий переключится на обычный путь).
   */
  function putDirect(url, blob, onp, timeoutMs = 60000) {
    return new Promise((res, rej) => {
      const fail = (why, sent) => { const e = new Error('Прямая загрузка: ' + why); e.code = 'DIRECT'; e.sent = sent; rej(e); };
      let sentAll = false;
      const x = new XMLHttpRequest();
      x.open('PUT', url);
      x.timeout = timeoutMs;
      x.setRequestHeader('Content-Type', 'image/jpeg');
      x.upload.onprogress = e => { if (e.lengthComputable) { onp(e.loaded / e.total); if (e.loaded >= e.total) sentAll = true; } };
      x.onload = () => {
        if (x.status >= 200 && x.status < 300) { try { const j = JSON.parse(x.responseText || '{}'); if (j.id) return res(j.id); } catch (e) {} }
        fail('ответ ' + x.status, sentAll);
      };
      x.onerror = () => fail('сеть', sentAll);
      x.ontimeout = () => fail('таймаут', sentAll);
      x.send(blob);
    });
  }
  const directOk = () => { try { return +(localStorage.getItem('t26-direct-off') || 0) < Date.now(); } catch (e) { return true; } };
  const directOff = () => { try { localStorage.setItem('t26-direct-off', String(Date.now() + 864e5)); } catch (e) {} }; // сутки грузим обычным путём

  /**
   * Неотправленные отчёты на телефоне (IndexedDB: фото уже сжаты, ~200 КБ каждое).
   * Если приложение закрыли посреди отправки — при следующем открытии предложим доотправить.
   */
  const Pending = {
    _db: null,
    db() {
      if (this._db) return this._db;
      return (this._db = new Promise(res => {
        try { const r = indexedDB.open('t26-pending', 1); r.onupgradeneeded = () => r.result.createObjectStore('reports'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }
        catch (e) { res(null); }
      }));
    },
    async run(mode, fn) {
      const db = await this.db(); if (!db) return null;
      return new Promise(res => { try { const t = db.transaction('reports', mode), st = t.objectStore('reports'); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); } catch (e) { res(null); } });
    },
    save(s) {
      if (demo) return;
      const pick = x => ({ blob: x.blob, meta: x.meta, fileId: x.fileId || '' });
      const it = s.item;
      return this.run('readwrite', st => st.put({ id: s.reportId, uid: myId(), at: Date.now(),
        item: { key: it.key, day: it.day, no: it.no, time: it.time, vehicle: it.vehicle, photo: it.photo },
        type: s.type, times: s.times, noPhoto: s.noPhoto, comment: s.comment, location: s.location || null, pressedAt: s.pressedAt || Date.now(),
        shots: { arrival: s.shots.arrival.filter(x => x.blob).map(pick), departure: s.shots.departure.filter(x => x.blob).map(pick) } }, s.reportId));
    },
    /** Запись очереди: запомнить ID уже загруженных фото (после обрыва их не грузим снова). */
    saveRaw(p, s) {
      ['arrival', 'departure'].forEach(st => (p.shots[st] || []).forEach((x, i) => { const y = s.shots[st][i]; if (y && y.fileId) x.fileId = y.fileId; }));
      return this.run('readwrite', t => t.put(p, p.id));
    },
    del(id) { if (id) return this.run('readwrite', st => st.delete(id)); },
    async list() {
      const all = (await this.run('readonly', st => st.getAll())) || [];
      const week = Date.now() - 7 * 864e5;
      all.filter(r => r.at < week).forEach(r => this.del(r.id)); // старше недели — уже неактуально
      return all.filter(r => r.uid === myId() && r.at >= week);
    },
  };


  /* ========== ОТПРАВКА ОТЧЁТА: общий движок для экрана отчёта и фоновой очереди ========== */
  const stagesOf = s => s.type === 'full' ? ['arrival', 'departure'] : [s.type];
  const noPhotoOf = (s, k) => k === 'departure' && s.type === 'full' && !!s.noPhoto;
  // временные сбои: связь, Google задумался — отчёт остаётся в очереди и уходит сам
  const TRANSIENT = new Set(['NETWORK', 'OFFLINE', 'TIMEOUT', 'BAD_RESPONSE', 'SERVER_ERROR', 'GOOGLE_BUSY', 'BUSY']);
  const transientErr = e => !e || !e.code || TRANSIENT.has(e.code) || navigator.onLine === false;
  const sendingIds = new Set();

  /**
   * Загрузить фото и сохранить отчёт. s — состояние отчёта (экран или запись очереди);
   * в s же копится прогресс: total/done/inflight/committing и ID загруженных файлов (повтор не грузит их снова).
   */
  async function runSend(s, hooks = {}) {
    if (sendingIds.has(s.reportId)) { const e = new Error('Этот отчёт уже отправляется'); e.code = 'BUSY'; throw e; }
    sendingIds.add(s.reportId);
    const tick = hooks.tick || (() => {});
    const t0 = Date.now();
    try {
      const queue = [];
      stagesOf(s).forEach(st => { if (!noPhotoOf(s, st)) s.shots[st].forEach((x, i) => queue.push({ st, i: i + 1, x })); });
      s.total = queue.length; s.done = queue.filter(q => q.x.fileId).length;
      s.inflight = new Map(); s.committing = 0; tick();
      // геопозицию ищем параллельно с загрузкой; у отчёта из очереди она уже снята в момент нажатия
      const locP = s.location || s.skipLocation ? Promise.resolve(s.location || null) : getLocation();
      const todo = queue.filter(q => !q.x.fileId);
      let failed = null;
      const again = !!s.resumed || !!s.tried; // повторная попытка — сервер проверит, что уже сохранено
      s.tried = true;
      // 1) прямая загрузка: одним запросом получаем ссылки для всех фото
      s.direct = s.direct || { ok: 0, total: 0 };
      if (todo.length && directOk() && !demo) {
        try {
          const r = await api('reports.uploadInit', { key: s.item.key, day: s.item.day, reportId: s.reportId, origin: location.origin, retry: again,
            items: todo.map(q => ({ stage: q.st, index: q.i, size: q.x.blob.size, meta: q.x.meta })) }, 30000);
          (r.items || []).forEach(it => { const q = todo.find(z => z.st === it.stage && z.i === it.index); if (!q) return; if (it.fileId) q.x.fileId = it.fileId; else if (it.url) q.url = it.url; });
        } catch (e) { if (e.code === 'OFFLINE' || navigator.onLine === false) throw e; /* иначе все фото пойдут обычным путём */ }
        todo.filter(q => q.x.fileId).forEach(() => { s.done++; });
      }
      const viaScript = async q => {
        const data = await blobToB64(q.x.blob);
        let lastErr;
        for (let attempt = 1; attempt <= 2; attempt++) { // api сам повторяет сбои Google; здесь — ещё круг после паузы
          try {
            const r = await api('reports.upload', { key: s.item.key, day: s.item.day, reportId: s.reportId, stage: q.st, index: q.i, data, meta: q.x.meta, retry: attempt > 1 || again || !!q.url }, 45000);
            q.x.fileId = r.fileId; return;
          } catch (e) { lastErr = e; if (e.code === 'OFFLINE' || (e.code && !['TIMEOUT', 'NETWORK', 'SERVER_ERROR', 'BAD_RESPONSE', 'GOOGLE_BUSY'].includes(e.code))) break; await sleep(attempt * 1500); }
        }
        throw lastErr;
      };

        if (q.x.fileId) return;
        s.inflight.set(q, Date.now()); q.frac = null;
        try {
          if (q.url) {
            s.direct.total++;
            const p0 = Date.now();
            try { q.x.fileId = await putDirect(q.url, q.x.blob, f => { q.frac = f; }); s.direct.ok++; Metrics.add('photo.direct', Date.now() - p0, 'ok', 1); }
            catch (e) {
              Metrics.add('photo.direct', Date.now() - p0, navigator.onLine === false ? 'OFFLINE' : 'DIRECT', 1);
              if (navigator.onLine === false) throw Object.assign(new Error('Пропала связь'), { code: 'OFFLINE' });
              if (e.sent) directOff(); q.frac = null; s.inflight.set(q, Date.now()); await viaScript(q); // запасной путь
            }
          } else await viaScript(q);
        } finally { s.inflight.delete(q); }
        s.done++; tick();
        if (hooks.saved) hooks.saved(); // ID загруженного фото — в память телефона, чтобы не грузить его снова
      };
      // по 4 фото одновременно: быстрее, и не упираемся в лимит одновременных запусков Google
      const worker = async () => { while (todo.length && !failed) { const q = todo.shift(); try { await uploadOne(q); } catch (e) { failed = failed || e; } } };
      await Promise.all([worker(), worker(), worker(), worker()]);
      if (failed) throw failed;
      s.location = await locP;
      s.committing = Date.now(); tick();
      const counts = {}, times = {}, fileIds = {};
      stagesOf(s).forEach(st => {
        counts[st] = noPhotoOf(s, st) ? 0 : s.shots[st].length;
        times[st] = s.times[st];
        fileIds[st] = noPhotoOf(s, st) ? [] : s.shots[st].map(x => x.fileId).filter(Boolean);
      });
      const r = await api('reports.commit', { key: s.item.key, day: s.item.day, reportId: s.reportId, type: s.type, counts, times, fileIds, direct: s.direct,
        noPhoto: { departure: noPhotoOf(s, 'departure') }, comment: s.comment, location: s.location, pressedAt: s.pressedAt || 0 }, 90000);
      Metrics.add(hooks.queued ? 'report.queued' : 'report.send', Date.now() - t0, 'ok', 1);
      return r;
    } catch (e) {
      Metrics.add(hooks.queued ? 'report.queued' : 'report.send', Date.now() - t0, navigator.onLine === false ? 'OFFLINE' : e.code || 'ERROR', 1);
      throw e;
    } finally { sendingIds.delete(s.reportId); }
  }

  /**
   * Очередь отчётов на телефоне. Всё, что нажали «Отправить», но не дошло (нет связи, закрыли приложение),
