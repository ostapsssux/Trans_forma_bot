<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Звонок</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ede5db;color:#322e29;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  a{display:inline-block;margin:18px 0 10px;padding:16px 30px;border-radius:999px;background:#efb88f;color:#843d12;font-weight:600;text-decoration:none;font-size:18px}
  small{color:#857c71}
</style>
</head>
<body>
<div>
  <div id="num" style="font-size:22px;font-weight:600"></div>
  <a id="call" href="#">Позвонить</a><br>
  <small>После звонка вернитесь в Telegram</small>
</div>
<script>
  // Страница-помощник для iPhone: Telegram не открывает tel: изнутри приложения, а Safari открывает.
  var n = decodeURIComponent((location.hash || '').slice(1)).replace(/[^\d+]/g, '');
  document.getElementById('num').textContent = n;
  document.getElementById('call').href = 'tel:' + n;
  if (n) location.replace('tel:' + n);
</script>
</body>
</html>
